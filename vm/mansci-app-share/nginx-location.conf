# Place inside the public HTTPS server block. Only X-Accel-Redirect responses
# from the authenticated Hub service can enter this dynamic upstream route.
location ~ ^/__mansci_app_share/([^/]+)/([0-9]+)/?(.*)$ {
    internal;
    set $mansci_share_token $1;
    set $mansci_app_port $2;
    set $mansci_app_path $3;
    proxy_pass http://127.0.0.1:$mansci_app_port/$mansci_app_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /services/mansci-app-share/s/$1/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 86400;
    proxy_redirect ~^(/.*)$ /services/mansci-app-share/s/$mansci_share_token$1;
}

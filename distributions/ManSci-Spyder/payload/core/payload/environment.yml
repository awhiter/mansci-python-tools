name: mansci-python
channels:
  - defaults
dependencies:
  - python=3.13
  - spyder
  - jupyterlab
  - ipykernel
  - jupytext
  - numpy
  - pandas
  - scipy
  - statsmodels
  - matplotlib
  - scikit-learn
  - sympy
  - openpyxl
  - networkx
  - seaborn
  - requests
  - pip
  - pip:
      # GenAI challenge prototyping and application toolkit.
      - streamlit
      - flask
      - dash
      - plotly
      - openai>=1,<3
      - ipywidgets
      - voila
      - gradio
      - PuLP
      - altair
      - pydantic
      - python-dotenv
      - Pillow
      - beautifulsoup4
      - folium
      - geopy
      - joblib
      - Faker
      - python-docx
      - reportlab
      - qrcode
      # Lets local JupyterLab expose student web apps safely.
      - jupyter-server-proxy
